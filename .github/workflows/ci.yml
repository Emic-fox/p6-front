# Workflow CI générique : même fichier pour le back-end Java (Gradle)
# et le front-end Angular (npm). Le type de projet est détecté à l'exécution.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Détection du type de projet
        id: project
        run: |
          if [ -f gradlew ]; then echo "type=gradle" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then echo "type=npm" >> "$GITHUB_OUTPUT"
          else echo "::error::Type de projet non reconnu"; exit 1
          fi

      # Java (back-end) : JDK 21 + cache Gradle
      - uses: actions/setup-java@v4
        if: steps.project.outputs.type == 'gradle'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Angular (front-end) : Node + cache npm
      - uses: actions/setup-node@v4
        if: steps.project.outputs.type == 'npm'
        with:
          node-version: "20.19"
          cache: npm

      # Lance les tests selon le type de projet, rapports JUnit dans test-results/
      - name: Exécution des tests
        run: bash ./run-tests.sh

      # Affiche un résumé directement sur la page du run
      # Les attributs JUnit diffèrent selon l'outil : Gradle écrit
      # tests/skipped/failures/errors, karma-junit-reporter tests/errors/failures (sans skipped).
      - name: Résumé des tests (Gradle)
        if: always() && steps.project.outputs.type == 'gradle' # Même si les tests échouent
        run: |
          echo "## Résultats des tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -ho 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
            test-results/*.xml >> "$GITHUB_STEP_SUMMARY" \
            || echo "Aucun rapport trouvé" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Résumé des tests (npm)
        if: always() && steps.project.outputs.type == 'npm' # Même si les tests échouent
        run: |
          echo "## Résultats des tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -ho 'tests="[0-9]*" errors="[0-9]*" failures="[0-9]*"' \
            test-results/*.xml >> "$GITHUB_STEP_SUMMARY" \
            || echo "Aucun rapport trouvé" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Archivage du rapport de tests
        if: always() # Même si les tests échouent
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  # Construit l'image Docker et la publie sur le GitHub Container Registry
  # (suit https://docs.github.com/en/actions/publishing-packages/publishing-docker-images)
  build:
    needs: test # Pas de publication si les tests échouent
    if: github.event_name == 'push' # Pas de publication depuis les pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags : nom de la branche (ex: main) et SHA du commit (ex: sha-a1b2c3d)
      - name: Extraction des métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Construction et publication de l'image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Génération de l'attestation de provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
